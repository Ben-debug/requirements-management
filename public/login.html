<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 我的工作平台</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; color: #333; padding: 20px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 20% 20%, rgba(24,144,255,.16), transparent 45%),
                radial-gradient(circle at 82% 78%, rgba(114,46,209,.16), transparent 45%);
  }
  .login-wrap {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 420px;
  }
  .login-card {
    position: relative; width: 100%; max-width: 420px;
    background: #fff; border-radius: 14px; padding: 40px 38px 30px;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
    animation: cardIn .35s ease both;
  }
  @keyframes cardIn { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: none; } }
  .brand { text-align: center; margin-bottom: 26px; }
  .brand-icon {
    width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 14px;
    background: linear-gradient(135deg, #1890ff, #0f3460);
    display: flex; align-items: center; justify-content: center; font-size: 27px;
    box-shadow: 0 8px 18px rgba(15,52,96,.28);
  }
  .brand-title { font-size: 21px; font-weight: 700; letter-spacing: .5px; color: #1a1a2e; }
  .brand-sub { font-size: 12px; color: #999; margin-top: 6px; letter-spacing: 1px; }
  .mode-title { font-size: 15px; font-weight: 600; color: #333; margin: 0 0 18px; text-align: center; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 7px; font-weight: 500; }
  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%; padding: 11px 42px 11px 13px; font-size: 14px;
    border: 1px solid #d9d9d9; border-radius: 7px; outline: none;
    transition: border-color .2s, box-shadow .2s; background: #fafafa;
  }
  .input-wrap input:focus { border-color: #1890ff; background: #fff; box-shadow: 0 0 0 3px rgba(24,144,255,.12); }
  .toggle-pwd {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: none; background: transparent; cursor: pointer; color: #999;
    font-size: 12px; padding: 6px 8px; border-radius: 4px;
  }
  .toggle-pwd:hover { color: #1890ff; background: #f0f5ff; }
  .btn-login {
    width: 100%; margin-top: 8px; padding: 12px; font-size: 15px; font-weight: 600;
    color: #fff; border: none; border-radius: 7px; cursor: pointer;
    background: linear-gradient(135deg, #1890ff, #0f3460);
    box-shadow: 0 6px 16px rgba(24,144,255,.28); transition: opacity .2s, transform .1s;
  }
  .btn-login:hover { opacity: .92; }
  .btn-login:active { transform: translateY(1px); }
  .btn-login:disabled { opacity: .6; cursor: wait; }
  .error {
    display: none; margin-bottom: 16px; padding: 10px 12px; font-size: 13px;
    color: #a8071a; background: #fff2f0; border: 1px solid #ffccc7;
    border-radius: 6px; line-height: 1.5;
  }
  .hint { margin-top: 20px; padding-top: 16px; border-top: 1px solid #f0f0f0; font-size: 12px; color: #999; text-align: center; line-height: 1.7; }
  .footer-note { text-align: center; color: rgba(255,255,255,.55); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">📋</div>
        <div class="brand-title">我的工作平台</div>
        <div class="brand-sub">MY WORKSPACE</div>
      </div>

      <div id="mode-title" class="mode-title">登录</div>
      <div id="login-error" class="error"></div>

      <form id="login-form" onsubmit="doLogin(event)" style="display:none">
        <div class="field">
          <label for="login-username">用户名</label>
          <div class="input-wrap"><input id="login-username" type="text" value="admin" autocomplete="username" required></div>
        </div>
        <div class="field">
          <label for="login-password">访问口令</label>
          <div class="input-wrap">
            <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入访问口令" required>
            <button type="button" class="toggle-pwd" id="toggle-login-pwd" onclick="togglePwd('login-password','toggle-login-pwd')">显示</button>
          </div>
        </div>
        <button id="login-submit" type="submit" class="btn-login">登 录</button>
      </form>

      <form id="setup-form" onsubmit="doSetup(event)" style="display:none">
        <div class="field">
          <label for="setup-password">设置访问口令</label>
          <div class="input-wrap">
            <input id="setup-password" type="password" autocomplete="new-password" placeholder="至少 6 位" required>
            <button type="button" class="toggle-pwd" id="toggle-setup-pwd" onclick="togglePwd('setup-password','toggle-setup-pwd')">显示</button>
          </div>
        </div>
        <div class="field">
          <label for="setup-confirm">确认访问口令</label>
          <div class="input-wrap"><input id="setup-confirm" type="password" autocomplete="new-password" placeholder="再次输入口令" required></div>
        </div>
        <button id="setup-submit" type="submit" class="btn-login">设置并进入</button>
      </form>

      <div class="hint">用户名固定为 <b>admin</b><br>口令可在「参数配置 → 访问口令」中修改</div>
    </div>
    <div class="footer-note">🔒 本地部署 · 数据仅存本机 · 不联网</div>
    <div class="footer-note">登录会话有效期 8 小时</div>
  </div>


<script>
function $(id) { return document.getElementById(id); }
function showError(msg) { const e = $('login-error'); e.textContent = msg; e.style.display = 'block'; }
function clearError() { const e = $('login-error'); e.textContent = ''; e.style.display = 'none'; }
function togglePwd(inputId, btnId) {
  const input = $(inputId), btn = $(btnId);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '隐藏' : '显示';
}
function showLogin() {
  $('mode-title').textContent = '登录';
  $('login-form').style.display = 'block';
  $('setup-form').style.display = 'none';
}
function showSetup() {
  $('mode-title').textContent = '首次使用 · 设置访问口令';
  $('login-form').style.display = 'none';
  $('setup-form').style.display = 'block';
}
async function checkAuthStatus() {
  try {
    const r = await fetch('/api/auth/status');
    const d = await r.json();
    if (d.success && d.data && d.data.needsSetup) showSetup();
    else showLogin();
  } catch (e) { showLogin(); showError('无法连接服务，请稍后重试'); }
}
async function postJson(url, body) {
  const r = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  return { ok: r.ok, data: d };
}
async function doLogin(e) {
  e.preventDefault(); clearError();
  const password = $('login-password').value;
  if (!password) { showError('请输入访问口令'); return; }
  const btn = $('login-submit'); btn.disabled = true; btn.textContent = '登录中...';
  try {
    const { ok, data } = await postJson('/api/auth/login', { username: $('login-username').value.trim(), password });
    if (ok && data.success) { location.replace('/'); return; }
    showError(data.code === 'NEED_SETUP' ? '请先设置访问口令' : (data.message || '登录失败'));
  } catch (err) { showError('网络异常，请稍后重试'); }
  finally { btn.disabled = false; btn.textContent = '登 录'; }
}
async function doSetup(e) {
  e.preventDefault(); clearError();
  const password = $('setup-password').value, confirm = $('setup-confirm').value;
  if (password.length < 6) { showError('口令至少 6 位'); return; }
  if (password !== confirm) { showError('两次输入的口令不一致'); return; }
  const btn = $('setup-submit'); btn.disabled = true; btn.textContent = '设置中...';
  try {
    const { ok, data } = await postJson('/api/auth/setup', { password, confirm });
    if (ok && data.success) { location.replace('/'); return; }
    showError(data.message || '设置失败');
  } catch (err) { showError('网络异常，请稍后重试'); }
  finally { btn.disabled = false; btn.textContent = '设置并进入'; }
}
document.addEventListener('DOMContentLoaded', checkAuthStatus);
</script>
</body>
</html>
